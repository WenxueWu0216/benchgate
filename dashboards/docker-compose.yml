# Local Grafana over the DuckDB results file.
#   BENCHGATE_DB=$PWD/../benchgate.duckdb docker compose up
# then open http://localhost:3000 (admin/admin) -> Dashboards -> BenchGate.
services:
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_INSTALL_PLUGINS: motherduck-duckdb-datasource
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: motherduck-duckdb-datasource
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./grafana/duckdb:/var/lib/grafana/dashboards/benchgate:ro
      - ${BENCHGATE_DB:-../benchgate.duckdb}:/data/benchgate.duckdb:ro
