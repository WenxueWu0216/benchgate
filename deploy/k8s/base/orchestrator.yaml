apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: benchgate-data
  namespace: benchgate
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchgate-orchestrator
  namespace: benchgate
  labels:
    app.kubernetes.io/name: benchgate-orchestrator
    app.kubernetes.io/part-of: benchgate
spec:
  # DuckDB is a single-writer file: one replica with the local store. With the
  # BigQuery store, replicas can scale out; leases keep them from colliding.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: benchgate-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: benchgate-orchestrator
        app.kubernetes.io/part-of: benchgate
    spec:
      serviceAccountName: benchgate-orchestrator
      # Never on a bench node: the orchestrator would be a noisy neighbour.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: benchgate.io/bench-node
                    operator: DoesNotExist
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: orchestrator
          image: benchgate:dev
          imagePullPolicy: IfNotPresent
          args: ["serve", "--executor", "k8s"]
          env:
            - name: BENCHGATE_STORE
              value: duckdb:///data/benchgate.duckdb
            - name: BENCHGATE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: BENCHGATE_IMAGE
              value: benchgate:dev
            - name: BENCHGATE_PLOT_DIR
              value: /data/plots
            - name: BENCHGATE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: benchgate-api
                  key: token
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: benchgate-data
---
apiVersion: v1
kind: Service
metadata:
  name: benchgate
  namespace: benchgate
spec:
  selector:
    app.kubernetes.io/name: benchgate-orchestrator
  ports:
    - name: http
      port: 80
      targetPort: http
