# One line per bench node. bench_cpus are the cores benchmarks run on; they get
# isolcpus/nohz_full/rcu_nocbs. housekeeping_cpus run the kernel, kubelet,
# IRQs and everything else. Keep whole physical cores together.
[bench]
bench-01 ansible_host=10.0.0.11 bench_cpus=2-7 housekeeping_cpus=0-1
bench-02 ansible_host=10.0.0.12 bench_cpus=2-7 housekeeping_cpus=0-1

[bench:vars]
ansible_user=ubuntu
